services:
  quimerareader:
    image: ghcr.io/tomas-falcon/quimerareader:latest
    # build: 
    #   context: .
    #   dockerfile: Dockerfile
    container_name: quimerareader
    ports:
      - "5000:5000" # Exponemos el servidor unificado en el puerto 5000
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      # Ruta de la base de datos dentro del contenedor
      - QUIMERA_DB_PATH=/config/quimerareader.db
    volumes:
      # Carpeta donde dejas los libros sueltos (Si usas el modo "Mover", asegúrate de no poner :ro)
      - ./media:/media
      
      # Carpeta donde QuimeraReader organiza tu biblioteca (EPUBs/Audios finales)
      - ./library:/library
      
      # Carpeta donde guarda la Base de Datos SQLite, Ajustes y SyncMaps
      - ./config:/config
      
      # Socket de Docker para permitir reinicio y actualizaciones desde la web
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Actualizador automático (Watchtower)
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --http-api-update --http-api-periodic-polls --http-api-token quimera quimerareader
    restart: unless-stopped

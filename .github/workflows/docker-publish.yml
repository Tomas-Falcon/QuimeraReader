name: Docker Build and Publish

on:
  push:
    branches: [ "main", "dev" ]
    # Opcional: TambiÃ©n puedes hacer que se construya cuando crees un "Release" o un "Tag" (v1.0, v2.0)
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "dev" ]

env:
  REGISTRY: ghcr.io
  # tomas-falcon/quimerareader
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Application Version
        id: version_step
        shell: bash
        run: |
          RAW_VER=$(git describe --tags --abbrev=7 --always 2>/dev/null || echo "1.0.6")
          # Remove leading 'v' if present for clean semantic versioning
          CLEAN_VER=${RAW_VER#v}
          echo "VERSION=${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "Calculated version: ${CLEAN_VER}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.version_step.outputs.VERSION }}


name: Build & Release Clients (Android, Windows & Linux)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Plataforma a compilar'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - windows
          - linux
      create_release:
        description: '¿Crear GitHub Release descargable?'
        required: true
        default: true
        type: boolean
  push:
    # Tags v* -> Release estable. Push a dev con cambios en clientes -> pre-release "dev-latest" (se sobrescribe en cada build)
    tags:
      - 'v*'
    branches:
      - dev
    paths:
      - 'QuimeraReader.Clients/**'
      - 'QuimeraReader.Domain/**'
      - 'Directory.Build.props'
      - '.github/workflows/build-clients.yml'

# Un build de dev nuevo cancela el anterior que siga en curso (los de tags nunca se cancelan)
concurrency:
  group: build-clients-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'android'
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android Workload
        run: dotnet workload install maui-android

      - name: Decode Android Keystore
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE_BASE64 }}")
          [IO.File]::WriteAllBytes("${{ github.workspace }}/release.keystore", $bytes)

      - name: Publish & Sign Android APK
        run: |
          dotnet publish QuimeraReader.Clients/QuimeraReader.Mobile/QuimeraReader.Mobile.csproj `
            -f net10.0-android `
            -p:TargetPlatformOverride=net10.0-android `
            -c Release `
            -p:AndroidKeyStore=true `
            -p:AndroidSigningKeyStore="${{ github.workspace }}/release.keystore" `
            -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" `
            -p:AndroidSigningKeyPass="${{ secrets.ANDROID_KEY_PASSWORD }}" `
            -p:AndroidSigningStorePass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" `
            -p:PublishTrimmed=false `
            -p:RunAOTCompilation=false `
            -nodeReuse:false

      - name: Locate and Prepare APK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./dist
          $apk = Get-ChildItem -Path QuimeraReader.Clients/QuimeraReader.Mobile/bin/Release/net10.0-android -Filter *-Signed.apk -Recurse | Select-Object -First 1
          if (-not $apk) {
            $apk = Get-ChildItem -Path QuimeraReader.Clients/QuimeraReader.Mobile/bin/Release/net10.0-android -Filter *.apk -Recurse | Select-Object -First 1
          }
          if ($apk) {
            Copy-Item -Path $apk.FullName -Destination ./dist/QuimeraReader-Android.apk -Force
            Write-Host "APK encontrado y copiado a: ./dist/QuimeraReader-Android.apk"
          } else {
            Write-Error "No se encontró ningún archivo APK en bin/Release/net10.0-android."
          }

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuimeraReader-Android-APK
          path: ./dist/QuimeraReader-Android.apk

  build-windows:
    name: Build Windows App
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'windows'
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Windows Workload
        run: dotnet workload install maui-windows

      - name: Build & Publish Windows App
        run: |
          dotnet publish QuimeraReader.Clients/QuimeraReader.Mobile/QuimeraReader.Mobile.csproj `
            -f net10.0-windows10.0.19041.0 `
            -p:TargetPlatformOverride=net10.0-windows10.0.19041.0 `
            -c Release `
            -p:WindowsPackageType=None `
            -p:RuntimeIdentifier=win-x64 `
            -nodeReuse:false -m:1 `
            -o ./publish/windows

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./dist
          Compress-Archive -Path ./publish/windows/* -DestinationPath ./dist/QuimeraReader-Windows-x64.zip -Force
          Write-Host "Paquete Windows comprimido en ./dist/QuimeraReader-Windows-x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuimeraReader-Windows-x64
          path: ./dist/QuimeraReader-Windows-x64.zip

  build-linux:
    name: Build Linux Desktop App
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'linux'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build & Publish Linux Desktop App
        run: |
          dotnet publish QuimeraReader.Clients/QuimeraReader.Desktop/QuimeraReader.Desktop.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=false \
            -o ./publish/linux

      - name: Package Linux Archive
        shell: bash
        run: |
          mkdir -p ./dist
          chmod +x ./publish/linux/QuimeraReader.Desktop ./publish/linux/install.sh
          tar -czvf ./dist/QuimeraReader-Linux-x64.tar.gz -C ./publish/linux .
          echo "Paquete Linux comprimido en ./dist/QuimeraReader-Linux-x64.tar.gz"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuimeraReader-Linux-x64
          path: ./dist/QuimeraReader-Linux-x64.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows, build-linux]
    if: always() && (github.event_name == 'push' || inputs.create_release == true) && (needs.build-android.result == 'success' || needs.build-windows.result == 'success' || needs.build-linux.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets
          merge-multiple: true

      - name: Determine Tag Name
        id: tag_name
        shell: bash
        run: |
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "TAG=dev-latest" >> $GITHUB_OUTPUT
            echo "NAME=Dev build (${GITHUB_SHA::7})" >> $GITHUB_OUTPUT
            echo "PRERELEASE=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "NAME=Release ${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "PRERELEASE=false" >> $GITHUB_OUTPUT
          else
            TAG="client-build-$(date +'%Y%m%d-%H%M%S')"
            echo "TAG=${TAG}" >> $GITHUB_OUTPUT
            echo "NAME=Release ${TAG}" >> $GITHUB_OUTPUT
            echo "PRERELEASE=false" >> $GITHUB_OUTPUT
          fi

      # Los archivos llevan la versión en el nombre (QuimeraReader-v1.0.21-Android.apk): las builds de dev usan
      # dev-<commit> y las manuales build-<commit>, para distinguir qué se instaló
      - name: Add version to asset names
        shell: bash
        run: |
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            VERSION="dev-${GITHUB_SHA::7}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="build-${GITHUB_SHA::7}"
          fi
          cd ./release-assets
          for f in QuimeraReader-*; do
            [ -e "$f" ] || continue
            mv "$f" "QuimeraReader-${VERSION}-${f#QuimeraReader-}"
          done
          ls -la

      # dev-latest es una pre-release "rodante": se borra (con su tag) para recrearla apuntando al commit actual
      - name: Remove previous dev-latest pre-release
        if: github.ref == 'refs/heads/dev'
        shell: bash
        run: gh release delete dev-latest --cleanup-tag --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_name.outputs.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag_name.outputs.NAME }}
          body: ${{ github.ref == 'refs/heads/dev' && format('Build automático de la rama dev ({0}). Solo para pruebas.', github.sha) || '' }}
          draft: false
          prerelease: ${{ steps.tag_name.outputs.PRERELEASE }}
          make_latest: ${{ steps.tag_name.outputs.PRERELEASE == 'true' && 'false' || 'true' }}
          files: |
            ./release-assets/*.apk
            ./release-assets/*.zip
            ./release-assets/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CI/CD Pipeline

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore Workloads
      run: dotnet workload restore QuimeraReader.slnx
      
    - name: Restore dependencies
      run: dotnet restore QuimeraReader.slnx
      
    - name: Build
      run: dotnet build QuimeraReader.slnx --no-restore
      
    - name: Test
      run: dotnet test QuimeraReader.slnx --no-build --verbosity normal

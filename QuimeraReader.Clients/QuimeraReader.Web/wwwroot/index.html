<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuimeraReader.Web</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/dark.css" />
    <link rel="stylesheet" href="css/app.css?v=3" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="QuimeraReader.Web.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

    <!-- epub.js for EPUB rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
</head>
<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">??</span>
    </div>

    <script>
        window.themeManager = {
            toggleTheme: function () {
                const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                return newTheme;
            },
            initTheme: function () {
                const savedTheme = localStorage.getItem('theme');
                if (savedTheme) {
                    document.documentElement.setAttribute('data-theme', savedTheme);
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            }
        };
        window.themeManager.initTheme();
        window.netflixScroll = {
            initialize: function () {
                document.addEventListener('wheel', function(e) {
                    const row = e.target.closest('.netflix-row');
                    if (row && Math.abs(e.deltaY) > 0) {
                        e.preventDefault();
                        row.scrollLeft += e.deltaY;
                    }
                }, { passive: false });
            }
        };
        window.netflixScroll.initialize();

        window.infiniteScroll = {
            initialize: function (element, dotnetHelper) {
                if (!element) return;
                const observer = new IntersectionObserver(async (entries) => {
                    if (entries[0].isIntersecting) {
                        await dotnetHelper.invokeMethodAsync('LoadMoreRequested');
                    }
                }, { rootMargin: "200px" });
                observer.observe(element);
            }
        };
    </script>

    <!-- Script de Radzen agregado acá -->
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>QuimeraReader.Mobile</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css?v=2" />
    <link rel="stylesheet" href="QuimeraReader.Mobile.styles.css" />
    <link rel="icon" href="data:,">

    <link rel="stylesheet" href="_content/Radzen.Blazor/css/dark-base.css">

    <!-- Para cuando hagamos lo de los estilos-->
    <!-- <link rel="stylesheet" href="_content/QuimeraReader.Shared/mi-tema-personalizado.css"> -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        window.themeManager = {
            toggleTheme: function () {
                const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                return newTheme;
            },
            initTheme: function () {
                const savedTheme = localStorage.getItem('theme');
                if (savedTheme) {
                    document.documentElement.setAttribute('data-theme', savedTheme);
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            }
        };
        window.themeManager.initTheme();
        window.netflixScroll = {
            initialize: function () {
                document.addEventListener('wheel', function(e) {
                    const row = e.target.closest('.netflix-row');
                    if (row && Math.abs(e.deltaY) > 0) {
                        e.preventDefault();
                        row.scrollLeft += e.deltaY;
                    }
                }, { passive: false });
            }
        };
        window.netflixScroll.initialize();

        window.infiniteScroll = {
            initialize: function (element, dotnetHelper, methodName = 'LoadMoreRequested') {
                if (!element) return;
                const observer = new IntersectionObserver(async (entries) => {
                    if (entries[0].isIntersecting) {
                        await dotnetHelper.invokeMethodAsync(methodName);
                    }
                }, { rootMargin: "200px" });
                observer.observe(element);
            }
        };
    </script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
</body>

</html>
